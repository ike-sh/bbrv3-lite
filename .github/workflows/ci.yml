name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate
        run: bash scripts/validate.sh

      - name: Generated file is current
        run: git diff --exit-code -- net-tcp-tune.sh

  tc-integration:
    needs: shell
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian: ['12', '13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: TC integration test (Debian ${{ matrix.debian }})
        run: |
          docker run --rm --cap-add NET_ADMIN -v "$PWD:/src:ro" "debian:${{ matrix.debian }}" \
            bash -lc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 procps util-linux >/dev/null && bash /src/tests/integration_tc.sh'
